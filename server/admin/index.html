<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会议报名管理后台</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="logo">
                <h2>管理后台</h2>
            </div>
            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-page="dashboard">数据概览</a>
                <a href="#" class="nav-item" data-page="registrations">报名列表</a>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="top-bar">
                <h1>第二届生物免疫治疗中心建设现场观摩交流会</h1>
                <div class="user-info">
                    <span>管理员</span>
                </div>
            </header>

            <!-- 数据概览页 -->
            <div class="page" id="dashboardPage">
                <h2 class="page-title">数据概览</h2>
                <div class="stats-cards">
                    <div class="stat-card">
                        <div class="stat-icon total">📋</div>
                        <div class="stat-info">
                            <h3>总报名人数</h3>
                            <p class="stat-number" id="statTotal">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon attend">✅</div>
                        <div class="stat-info">
                            <h3>确认参加</h3>
                            <p class="stat-number" id="statAttend">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon not-attend">❌</div>
                        <div class="stat-info">
                            <h3>无法参加</h3>
                            <p class="stat-number" id="statNotAttend">0</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon hotel">🏨</div>
                        <div class="stat-info">
                            <h3>需要住宿</h3>
                            <p class="stat-number" id="statHotel">0</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 报名列表页 -->
            <div class="page" id="registrationsPage" style="display:none;">
                <h2 class="page-title">报名列表</h2>
                
                <!-- 筛选栏 -->
                <div class="filter-bar">
                    <div class="filter-group">
                        <label>参会状态：</label>
                        <select id="filterStatus">
                            <option value="">全部</option>
                            <option value="1">确认参加</option>
                            <option value="0">无法参加</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>搜索：</label>
                        <input type="text" id="searchInput" placeholder="姓名/医院/电话">
                    </div>
                    <button class="btn btn-primary" onclick="loadRegistrations()">刷新</button>
                    <button class="btn btn-export" onclick="exportData()">导出Excel</button>
                </div>

                <!-- 数据表格 -->
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>照片</th>
                                <th>姓名</th>
                                <th>职称</th>
                                <th>医院/单位</th>
                                <th>科室</th>
                                <th>电话</th>
                                <th>邮箱</th>
                                <th>简历附件</th>
                                <th>参会状态</th>
                                <th>住宿</th>
                                <th>提交时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="registrationsTableBody">
                            <!-- 动态填充 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 照片查看弹窗 -->
    <div class="modal" id="photoViewModal">
        <div class="modal-content photo-view-content">
            <span class="close-btn" onclick="closePhotoView()">&times;</span>
            <h2 class="modal-title">头像照片 - <span id="photoViewName"></span></h2>
            <div class="photo-view-body">
                <img id="photoViewSrc" src="" alt="头像照片">
            </div>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeDetailModal()">&times;</span>
            <h2 class="modal-title">报名详情</h2>
            <div class="detail-grid" id="detailContent">
                <!-- 动态填充 -->
            </div>
        </div>
    </div>

    <script src="../../config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
